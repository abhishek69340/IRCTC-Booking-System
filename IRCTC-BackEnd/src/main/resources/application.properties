spring.application.name=IRCTC-BackEnd

# ============================================================
# SERVER - Railway provides PORT automatically
# ============================================================
server.port=${PORT:8080}

# ============================================================
# MYSQL - Railway MySQL variables
# Set these in Railway if they are not automatically referenced:
# MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD
# ============================================================
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# MYSQL CONNECTION POOL
# ============================================================
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.validationTimeout=5000
spring.datasource.hikari.initializationFailTimeout=120000
spring.datasource.hikari.maximumPoolSize=5
spring.datasource.hikari.minimumIdle=0

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# RAZORPAY
# IMPORTANT: add these as Railway Variables.
# Do NOT commit the secret to GitHub.
# ============================================================
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

# ============================================================
# CORS
# Example Railway value:
# https://your-frontend.netlify.app,https://your-frontend.vercel.app
# ============================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://irctcc.netlify.app,https://irctcc.vercel.app}

# ============================================================
# ERROR RESPONSE
# ============================================================
server.error.include-message=always
